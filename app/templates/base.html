<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio Manager{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <header class="container-fluid">
    <nav>
      <ul>
        <li><strong>Portfolio Manager</strong></li>
      </ul>
      <ul>
        <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
        <li><a href="/portfolio/nav-history" {% if request.url.path == "/portfolio/nav-history" %}aria-current="page"{% endif %}>NAV History</a></li>
        <li><a href="/portfolio/breakdown" {% if request.url.path == "/portfolio/breakdown" %}aria-current="page"{% endif %}>Portfolio Breakdown</a></li>
        <li><a href="/portfolio/fund-breakdown" {% if request.url.path == "/portfolio/fund-breakdown" %}aria-current="page"{% endif %}>Fund Breakdown</a></li>
        <li><a href="/charts/price" {% if request.url.path == "/charts/price" %}aria-current="page"{% endif %}>OHLC Chart</a></li>
        <li><a href="/charts/nav" {% if request.url.path == "/charts/nav" %}aria-current="page"{% endif %}>Fund NAV Chart</a></li>
        <li><a href="/trades" {% if request.url.path == "/trades" %}aria-current="page"{% endif %}>Trades</a></li>
        <li><a href="/import" {% if request.url.path == "/import" %}aria-current="page"{% endif %}>Import</a></li>
        <li><a href="/kite" {% if request.url.path == "/kite" %}aria-current="page"{% endif %}>Kite</a></li>
        <li><a href="/settings" {% if request.url.path == "/settings" %}aria-current="page"{% endif %}>Settings</a></li>
      </ul>
    </nav>
  </header>

  <main class="container-fluid" style="padding:0 2rem;">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>

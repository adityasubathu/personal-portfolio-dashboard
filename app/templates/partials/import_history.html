{% if logs %}
<table>
  <thead>
    <tr>
      <th>File</th>
      <th>Imported At</th>
      <th>Rows</th>
      <th>Success</th>
      <th>Errors</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for log in logs %}
    <tr>
      <td>{{ log.filename }}</td>
      <td>{{ log.imported_at.strftime("%d %b %Y %H:%M") }}</td>
      <td>{{ log.row_count }}</td>
      <td>{{ log.success_count }}</td>
      <td>{{ log.error_count }}</td>
      <td>
        <button class="secondary outline"
                style="padding: 0.2rem 0.6rem; font-size: 0.8rem;"
                hx-delete="/api/v1/trades/import/{{ log.batch_id }}"
                hx-confirm="Roll back this import?"
                hx-target="closest tr"
                hx-swap="outerHTML">
          Rollback
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No imports yet.</p>
{% endif %}

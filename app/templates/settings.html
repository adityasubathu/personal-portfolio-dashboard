{% extends "base.html" %}
{% block title %}Settings — Portfolio Manager{% endblock %}

{% block content %}
<h2>Settings</h2>

<article>
  <header>Data</header>
  <p>
    <strong>Database:</strong> PostgreSQL at <code>{{ db_host }}:{{ db_port }}/{{ db_name }}</code>
  </p>
  <details>
    <summary>Danger Zone</summary>
    <div style="display: flex; flex-direction: column; gap: 0.5rem; max-width: 24rem;">
      <button class="secondary"
              hx-delete="/api/v1/settings/trades"
              hx-confirm="Delete ALL trades, holdings, and orphan instruments? This cannot be undone."
              hx-target="#danger-result">
        Clear Trades &amp; Holdings
      </button>
      <button class="secondary"
              hx-delete="/api/v1/settings/price-history"
              hx-confirm="Delete ALL Kite OHLC price history? This cannot be undone."
              hx-target="#danger-result">
        Clear Kite Price History
      </button>
      <button class="secondary"
              hx-delete="/api/v1/settings/nav-history"
              hx-confirm="Delete ALL MF/ETF NAV history? This cannot be undone."
              hx-target="#danger-result">
        Clear MF NAV History
      </button>
      <button class="secondary"
              hx-delete="/api/v1/settings/mf-breakdown"
              hx-confirm="Delete ALL MF breakdown and AMFI classification data? This cannot be undone."
              hx-target="#danger-result">
        Clear MF Breakdown
      </button>
      <button class="secondary"
              hx-delete="/api/v1/settings/manual-assets"
              hx-confirm="Delete ALL manual assets (FDs, PPF, NPS)? This cannot be undone."
              hx-target="#danger-result">
        Clear Manual Assets
      </button>
    </div>
    <div id="danger-result" style="margin-top: 0.5rem;"></div>
  </details>
</article>
{% endblock %}
